name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build for the iOS Simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cap:sync -- ios
      - name: Build (unsigned, simulator)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package the simulator app
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          ditto -c -k --keepParent App.app "$GITHUB_WORKSPACE/WildHorizons-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: park-ios-simulator
          path: WildHorizons-simulator.zip
          if-no-files-found: error

  publish:
    name: Publish to Latest build
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: latest-build-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: park-ios-simulator
      - uses: ./.github/actions/publish-latest
        with:
          file: WildHorizons-simulator.zip
